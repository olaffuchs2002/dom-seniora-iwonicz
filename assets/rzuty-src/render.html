<!doctype html><html><head><style>html,body{margin:0;background:#fbf9f5;overflow:hidden}#w{position:absolute;left:0;top:0;transform-origin:0 0}canvas{display:block}</style></head><body><div id="w"><canvas id="c"></canvas></div>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const c=document.getElementById('c'), w=document.getElementById('w');
window.renderPlan = async (file, crop, outW, clean) => {
  window.done=false;
  const doc = await pdfjs.getDocument('../rzuty/' + file).promise;
  const pg = await doc.getPage(1);
  const v1 = pg.getViewport({scale:1});
  const [x0,y0,x1,y1] = crop || [0,0,v1.width,v1.height];
  const s = (outW||1600)/(x1-x0);
  const v = pg.getViewport({scale:s, offsetX:-x0*s, offsetY:-y0*s});
  c.width = Math.round((x1-x0)*s); c.height = Math.round((y1-y0)*s);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:ctx, viewport:v}).promise;
  if (clean) {
    const im=ctx.getImageData(0,0,c.width,c.height), d=im.data;
    const P=[251,249,245], I=[52,43,37];
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b), sat=mx?(mx-mn)/mx:0;
      let h=0; if(mx!==mn){ if(mx===r) h=((g-b)/(mx-mn))%6; else if(mx===g) h=(b-r)/(mx-mn)+2; else h=(r-g)/(mx-mn)+4; h*=60; if(h<0)h+=360; }
      let k;
      if (sat>.18 && !(h>180&&h<260)) k=0;
      else { const L=(.3*r+.59*g+.11*b)/255; k=Math.min(1,Math.max(0,(1-L)*1.25)); if(h>180&&h<260&&sat>.18) k=Math.max(k,.55); }
      d[i]=P[0]+(I[0]-P[0])*k; d[i+1]=P[1]+(I[1]-P[1])*k; d[i+2]=P[2]+(I[2]-P[2])*k;
    }
    ctx.putImageData(im,0,0);
  }
  window.dims=[c.width,c.height];
  window.done=true;
  fit();
};
window.fit=()=>{ const k=Math.min(innerWidth/c.width, innerHeight/c.height); w.style.transform=`scale(${k})`; };
window.tile=(x,y)=>{ w.style.transform=`translate(${-x}px,${-y}px)`; };
window.ready=true;
</script></body></html>
